# ThingWire Safety Configuration
# Devices are auto-registered from their WoT TD on discovery.
# Add explicit overrides here if needed.

devices: {}

global:
  require_confirmation_for_dangerous: true
  deadman_switch_timeout_seconds: 300
  audit_log_retention_days: 30
  default_rate_limit:
    max_calls: 10
    window_seconds: 60
  # Out-of-range numeric input: "reject" (default) or "clamp" (opt-in).
  out_of_range: reject
  # Latched e-stop. Only these identities may call reset_estop().
  estop:
    authorized_resetters:
      - operator
  # Throttle repeated denials per (device, action). threshold 0 disables.
  denial_flood:
    threshold: 20
    window_seconds: 60
    counted_codes:
      - INVALID_INPUT
      - OUT_OF_RANGE
      - SLEW_EXCEEDED
      - ACTION_NOT_ALLOWED
