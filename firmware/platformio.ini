[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
build_src_filter =
    +<*>
    -<deskbot_*>
    -<servo_head.*>
    -<oled_eyes.*>
    -<pir_input.*>
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson@^7.0

; Desk bot: Seeed XIAO ESP32S3 Sense, two servos, SSD1306 OLED, PIR.
; Pins and limits come from device-deskbot.yaml via src/deskbot_gen.h.
[env:xiao_esp32s3_deskbot]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall -Wextra
    -DBOARD_HAS_PSRAM
    -DMQTT_BUFFER_SIZE=4096
    '-DDEVICE_ID="desk-bot-001"'
build_src_filter =
    +<*>
    -<main.cpp>
    -<sensor_registry.*>
    -<actuator_controller.*>
    -<wot_td_generator.*>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit SSD1306@^2.5
    adafruit/Adafruit GFX Library@^1.11
