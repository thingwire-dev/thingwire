services:
  # Default: anonymous broker plus WebSocket viewer (plain `docker compose up -d`).
  # Known limitation: see docs/security-broker.md.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  # ACL profile: anonymous disabled, per-device ACLs. Run
  # `python scripts/gen_broker_acl.py --device <id>` first, then
  # `docker compose --profile acl up -d mosquitto-acl`. Published on host port 1884
  # so it can run beside the default broker. No WebSocket listener.
  mosquitto-acl:
    profiles: ["acl"]
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto-acl.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl/mosquitto.passwd:/mosquitto/config/mosquitto.passwd:ro
      - ./acl/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - mosquitto-acl-data:/mosquitto/data
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mosquitto
    environment:
      THINGWIRE_MQTT_BROKER: mosquitto
      THINGWIRE_MQTT_PORT: "1883"
      THINGWIRE_LOG_LEVEL: INFO
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-acl-data:
  gateway-data:
