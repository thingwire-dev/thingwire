# ACL profile: authenticated, per-device topic ACLs.
# Generate the mounted files with: python scripts/gen_broker_acl.py --device <id> ...
listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
