# ThingWire Safety Configuration
# Devices are auto-registered from their WoT TD on discovery.
# Add explicit overrides here if needed.

devices: {}

global:
  require_confirmation_for_dangerous: true
  deadman_switch_timeout_seconds: 300
  audit_log_retention_days: 30
  default_rate_limit:
    max_calls: 10
    window_seconds: 60
  # Out-of-range numeric input: "reject" (default) or "clamp" (opt-in).
  out_of_range: reject
  # Latched e-stop. Only these identities may call reset_estop().
  estop:
    authorized_resetters:
      - operator
  # Throttle repeated denials per (device, action). threshold 0 disables.
  denial_flood:
    threshold: 20
    window_seconds: 60
    counted_codes:
      - INVALID_INPUT
      - OUT_OF_RANGE
      - SLEW_EXCEEDED
      - ACTION_NOT_ALLOWED


# Provenance taint policy. Actions taken while untrusted-origin sensor data
# (camera, OCR, STT, range scans) has been in the agent's context since the last
# operator instruction need approval or the extra scope. Pure reads are allowed.
taint:
  enabled: true
  # Scope that lets a tainted action proceed without interactive approval.
  extra_scope: "taint:override"
  # Origins treated as untrusted: trusted_operator, device_telemetry, untrusted_perception.
  untrusted_origins: [untrusted_perception]
  # Numeric TD properties that come from perception (the only change from the repo config).
  perception_properties: [target_bearing]
  # Mode for actions not listed below: require_approval, allow or deny.
  default_mode: require_approval
  # Tool names that never actuate; always allowed.
  read_actions: []
  # Per-action override, e.g. sweep: {mode: deny}
  actions: {}

# Operator pins (contracts 5.4). Limits and approval come from here, not from the TD a device
# publishes. Values are copied from td-library/desk-bot.td.json. With a pin present, a device
# with no pin is denied, so the relay is pinned too.
td_trust:
  unpinned: auto
  devices:
    desk-bot:
      actions:
        look_at:
          inputs:
            pan: {minimum: -90, maximum: 90}
            tilt: {minimum: -30, maximum: 30}
        set_expression:
          inputs:
            expression: {enum: [neutral, happy, curious, sleepy, surprised, alert]}
        nod:
          inputs:
            times: {minimum: 1, maximum: 3}
        sweep:
          requires_approval: true
          inputs:
            speed_deg_s: {minimum: 10, maximum: 120}
    door-relay:
      actions:
        set_relay:
          requires_approval: true
