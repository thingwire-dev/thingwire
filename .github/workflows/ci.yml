name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      # Report-only until the existing ruff findings are fixed.
      - name: ruff
        continue-on-error: true
        run: ruff check .

      # Report-only: mypy --strict currently fails on existing code (missing yaml stubs, paho/FastMCP attrs).
      - name: mypy --strict
        continue-on-error: true
        run: mypy --strict src

  firmware:
    name: Firmware (pio run, all envs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build all firmware envs
        working-directory: firmware
        run: pio run
